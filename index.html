<!-- Hosts the Vite React application root. -->
<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiamReply — AI ตอบคอมเมนต์ลูกค้า</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Lets VS Code Live Server open the built app from the project root.
      window.setTimeout(function () {
        var root = document.getElementById('root');
        var isBuiltPage = window.location.pathname.replace(/\\/g, '/').includes('/dist/');

        if (!root || root.childElementCount || isBuiltPage) {
          return;
        }

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './dist/assets/index.css';
        document.head.appendChild(css);

        var app = document.createElement('script');
        app.type = 'module';
        app.src = './dist/assets/app.js';
        document.body.appendChild(app);
      }, 150);
    </script>
  </body>
</html>
